name: Build Tager Android 2.0.2 Production

on:
  push:
    branches: [ android-v2.0-ux-compat ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v20-production.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint and tests
        working-directory: android-app
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest

      - name: Build release APK and AAB
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify Android 16 compatibility manifest
        run: |
          MANIFEST_DIR=android-app/app/build/intermediates/merged_manifests/release
          if grep -R 'android:debuggable="true"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Release manifest is debuggable' >&2
            exit 1
          fi
          if grep -R 'android:screenOrientation="portrait"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Portrait lock is still present' >&2
            exit 1
          fi
          if grep -R 'android:enableOnBackInvokedCallback="false"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Predictive back is disabled' >&2
            exit 1
          fi
          if ! grep -R 'android:enableOnBackInvokedCallback="true"' "$MANIFEST_DIR" >/dev/null 2>&1; then
            echo 'Predictive back is not explicitly enabled' >&2
            exit 1
          fi
          if ! grep -R 'android:resizeableActivity="true"' "$MANIFEST_DIR" >/dev/null 2>&1; then
            echo 'Resizable activity support missing' >&2
            exit 1
          fi
          if ! grep -R 'com.tager.marketplace.TagerActivity' "$MANIFEST_DIR" >/dev/null 2>&1; then
            echo 'Modern TagerActivity launcher missing' >&2
            exit 1
          fi

      - name: Verify camera and package visibility
        run: |
          MANIFEST=android-app/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.camera.any' "$MANIFEST"
          grep -A2 'android.hardware.camera.any' "$MANIFEST" | grep -q 'android:required="false"'
          grep -q 'android.media.action.IMAGE_CAPTURE' "$MANIFEST"
          grep -q 'android:scheme="tel"' "$MANIFEST"
          grep -q 'android:scheme="mailto"' "$MANIFEST"
          grep -q 'android:scheme="sms"' "$MANIFEST"
          grep -q 'android:scheme="whatsapp"' "$MANIFEST"
          grep -q 'android:scheme="market"' "$MANIFEST"
          grep -q 'android:scheme="http"' "$MANIFEST"
          grep -q 'android:scheme="https"' "$MANIFEST"

      - name: Verify runtime reliability hardening
        run: |
          SRC=android-app/app/src/main/java/com/tager/marketplace/TagerActivity.java
          LAYOUT=android-app/app/src/main/res/layout/activity_main.xml
          grep -q 'mainFrameLoadFailed' "$SRC"
          grep -q 'camera.setClipData' "$SRC"
          grep -q 'grantUriPermission' "$SRC"
          grep -q 'releaseCameraUriPermissions' "$SRC"
          grep -q 'tryStartFileChooser' "$SRC"
          grep -q 'cancelFileChooser' "$SRC"
          grep -q 'onPageCommitVisible' "$SRC"
          grep -q 'restoreLastGoodPage' "$SRC"
          grep -q 'shouldUseOffscreenPreRaster' "$SRC"
          grep -q 'setOffscreenPreRaster(false)' "$SRC"
          grep -q 'nativeBottomNav.setPadding' "$SRC"
          grep -q 'fontScale' "$SRC"
          grep -q 'android:id="@+id/nativeBottomNav"' "$LAYOUT"
          grep -A4 'android:id="@+id/nativeBottomNav"' "$LAYOUT" | grep -q 'android:layout_height="wrap_content"'
          grep -A5 'android:id="@+id/nativeBottomNav"' "$LAYOUT" | grep -q 'android:minHeight="72dp"'
          if grep -q 'newProgress >= 60.*showLoading(false)' "$SRC"; then
            echo 'Early splash dismissal regression detected' >&2
            exit 1
          fi
          if grep -q 'clearCache(true)' "$SRC"; then
            echo 'Aggressive WebView cache clearing regression detected' >&2
            exit 1
          fi

      - name: Verify accessibility and touch targets
        run: |
          LAYOUT=android-app/app/src/main/res/layout/activity_main.xml
          grep -q 'android:accessibilityLiveRegion="polite"' "$LAYOUT"
          grep -q 'android:accessibilityHeading="true"' "$LAYOUT"
          grep -q 'android:contentDescription="إعادة محاولة الاتصال"' "$LAYOUT"
          grep -q 'android:contentDescription="تتبع الطلب"' "$LAYOUT"
          grep -q 'android:contentDescription="سلة المشتريات"' "$LAYOUT"
          grep -A5 'android:id="@+id/statusBanner"' "$LAYOUT" | grep -q 'android:minHeight="48dp"'
          for id in navHome navProducts navSuppliers navTrack navCart; do
            grep -A5 "android:id=\"@+id/$id\"" "$LAYOUT" | grep -q 'android:minHeight="62dp"'
          done

      - name: Verify release security manifest
        run: |
          MANIFEST_DIR=android-app/app/build/intermediates/merged_manifests/release
          grep -R 'android:allowBackup="false"' "$MANIFEST_DIR" >/dev/null
          grep -R 'android:usesCleartextTraffic="false"' "$MANIFEST_DIR" >/dev/null

      - name: Verify unsigned APK alignment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare outputs
        run: |
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk Tager-v2.0.2-production-unsigned.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v2.0.2-production-unsigned.aab
          sha256sum Tager-v2.0.2-production-unsigned.apk > Tager-v2.0.2-production-unsigned.apk.sha256
          sha256sum Tager-v2.0.2-production-unsigned.aab > Tager-v2.0.2-production-unsigned.aab.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.0.2-production-unsigned-APK
          path: |
            Tager-v2.0.2-production-unsigned.apk
            Tager-v2.0.2-production-unsigned.apk.sha256
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.0.2-production-unsigned-AAB
          path: |
            Tager-v2.0.2-production-unsigned.aab
            Tager-v2.0.2-production-unsigned.aab.sha256
          retention-days: 30
