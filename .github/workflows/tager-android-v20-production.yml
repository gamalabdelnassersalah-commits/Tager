name: Build Tager Android 2.0.1 Production

on:
  push:
    branches: [ android-v2.0-ux-compat ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v20-production.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint and tests
        working-directory: android-app
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest

      - name: Build release APK and AAB
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify Android 16 compatibility manifest
        run: |
          MANIFEST_DIR=android-app/app/build/intermediates/merged_manifests/release
          if grep -R 'android:debuggable="true"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Release manifest is debuggable' >&2
            exit 1
          fi
          if grep -R 'android:screenOrientation="portrait"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Portrait lock is still present' >&2
            exit 1
          fi
          if grep -R 'android:enableOnBackInvokedCallback="false"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Predictive back is disabled' >&2
            exit 1
          fi
          if ! grep -R 'com.tager.marketplace.TagerActivity' "$MANIFEST_DIR" >/dev/null 2>&1; then
            echo 'Modern TagerActivity launcher missing' >&2
            exit 1
          fi

      - name: Verify runtime reliability hardening
        run: |
          SRC=android-app/app/src/main/java/com/tager/marketplace/TagerActivity.java
          grep -q 'mainFrameLoadFailed' "$SRC"
          grep -q 'camera.setClipData' "$SRC"
          grep -q 'grantUriPermission' "$SRC"
          grep -q 'releaseCameraUriPermissions' "$SRC"
          grep -q 'onPageCommitVisible' "$SRC"
          grep -q 'nativeBottomNav.setPadding' "$SRC"
          grep -q 'fontScale' "$SRC"
          if grep -q 'newProgress >= 60.*showLoading(false)' "$SRC"; then
            echo 'Early splash dismissal regression detected' >&2
            exit 1
          fi

      - name: Verify release security manifest
        run: |
          MANIFEST_DIR=android-app/app/build/intermediates/merged_manifests/release
          grep -R 'android:allowBackup="false"' "$MANIFEST_DIR" >/dev/null
          grep -R 'android:usesCleartextTraffic="false"' "$MANIFEST_DIR" >/dev/null

      - name: Verify unsigned APK alignment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare outputs
        run: |
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk Tager-v2.0.1-production-unsigned.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v2.0.1-production-unsigned.aab
          sha256sum Tager-v2.0.1-production-unsigned.apk > Tager-v2.0.1-production-unsigned.apk.sha256
          sha256sum Tager-v2.0.1-production-unsigned.aab > Tager-v2.0.1-production-unsigned.aab.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.0.1-production-unsigned-APK
          path: |
            Tager-v2.0.1-production-unsigned.apk
            Tager-v2.0.1-production-unsigned.apk.sha256
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.0.1-production-unsigned-AAB
          path: |
            Tager-v2.0.1-production-unsigned.aab
            Tager-v2.0.1-production-unsigned.aab.sha256
          retention-days: 30
