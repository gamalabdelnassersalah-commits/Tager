name: Apply Tager Android 2.3.1 Stabilization Patch

on:
  push:
    branches: [ android-v2.3.1-stabilization ]
    paths:
      - 'scripts/stabilize_v231.py'
      - '.github/workflows/tager-v231-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-v2.3.1-stabilization
      - name: Apply deterministic stabilization patch
        run: python scripts/stabilize_v231.py
      - name: Commit generated 2.3.1 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize Android 2.3.1 single WebView runtime" || exit 0
          git push origin HEAD:android-v2.3.1-stabilization
