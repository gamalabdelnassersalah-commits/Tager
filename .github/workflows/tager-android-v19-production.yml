name: Build Tager Android 1.9 Production Hardened

on:
  push:
    branches: [ android-v1.9-production-hardening ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v19-production.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint and tests
        working-directory: android-app
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest

      - name: Build release APK and AAB
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify hardened release manifest
        run: |
          MANIFEST_DIR=android-app/app/build/intermediates/merged_manifests/release
          if grep -R 'android:debuggable="true"' "$MANIFEST_DIR" 2>/dev/null; then
            echo 'Release manifest is debuggable' >&2
            exit 1
          fi
          if ! grep -R 'android:allowBackup="false"' "$MANIFEST_DIR" >/dev/null 2>&1; then
            echo 'Release backup policy is not hardened' >&2
            exit 1
          fi
          if ! grep -R 'android:usesCleartextTraffic="false"' "$MANIFEST_DIR" >/dev/null 2>&1; then
            echo 'Cleartext traffic is not disabled' >&2
            exit 1
          fi

      - name: Verify unsigned APK alignment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare hardened outputs
        run: |
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk Tager-v1.9.0-production-unsigned.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v1.9.0-production-unsigned.aab
          sha256sum Tager-v1.9.0-production-unsigned.apk > Tager-v1.9.0-production-unsigned.apk.sha256
          sha256sum Tager-v1.9.0-production-unsigned.aab > Tager-v1.9.0-production-unsigned.aab.sha256

      - name: Package Android signing tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$SDK_ROOT/build-tools/35.0.0"
          mkdir -p signing-tools/lib
          cp "$TOOLS/apksigner" signing-tools/
          cp "$TOOLS/lib/apksigner.jar" signing-tools/lib/
          cp "$TOOLS/zipalign" signing-tools/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v1.9.0-production-unsigned-APK
          path: |
            Tager-v1.9.0-production-unsigned.apk
            Tager-v1.9.0-production-unsigned.apk.sha256
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v1.9.0-production-unsigned-AAB
          path: |
            Tager-v1.9.0-production-unsigned.aab
            Tager-v1.9.0-production-unsigned.aab.sha256
          retention-days: 30

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-tools-35-signing
          path: signing-tools
          retention-days: 1
