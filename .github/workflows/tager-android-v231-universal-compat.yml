name: Tager Android Universal Compatibility

on:
  push:
    branches: [ android-v2.3.1-signing-readiness ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v231-universal-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-matrix:
    name: Android API ${{ matrix.api }} install and launch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [23, 28, 30, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build isolated universal APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleUniversal

      - name: Verify launcher icon resources
        run: |
          set -euo pipefail
          test -s android-app/app/src/main/res/drawable/tager_launcher_mark.xml
          test -s android-app/app/src/main/res/drawable/tager_launcher_foreground.xml
          test -s android-app/app/src/main/res/drawable/tager_launcher_background.xml
          test -s android-app/app/src/main/res/drawable/tager_launcher_legacy.xml
          test -s android-app/app/src/main/res/drawable/tager_launcher_round_legacy.xml
          test -s android-app/app/src/main/res/drawable/tager_launcher_monochrome.xml
          grep -q '@drawable/tager_launcher_mark' android-app/app/src/main/res/drawable/tager_launcher_foreground.xml
          grep -q '@drawable/tager_launcher_legacy' android-app/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -q '@drawable/tager_launcher_round_legacy' android-app/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          grep -q '@drawable/tager_launcher_foreground' android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/tager_launcher_background' android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '<monochrome android:drawable="@drawable/tager_launcher_monochrome"' android-app/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -q '<monochrome android:drawable="@drawable/tager_launcher_monochrome"' android-app/app/src/main/res/mipmap-anydpi-v33/ic_launcher_round.xml
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=android-app/app/build/outputs/apk/universal/app-universal-unsigned.apk
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "application-label:'Tager Universal | تاجر'"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q 'application-icon-'
          echo 'Launcher icon resources verified for legacy, adaptive, round and themed Android launchers.'

      - name: Decode stable universal test key
        run: |
          base64 -d android-app/signing/tager-universal-test.jks.b64 > "$RUNNER_TEMP/tager-universal-test.jks"
          test -s "$RUNNER_TEMP/tager-universal-test.jks"

      - name: Sign universal APK with stable test certificate
        env:
          KS_PASS: TagerUniversalTest2026!
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SRC=android-app/app/build/outputs/apk/universal/app-universal-unsigned.apk
          ALIGNED="$RUNNER_TEMP/Tager-v2.3.1-universal-aligned.apk"
          OUT=Tager-v2.3.1-universal-stable-signed.apk
          test -s "$SRC"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -P 16 4 "$SRC" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tager-universal-test.jks" \
            --ks-key-alias tager-universal-test \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" \
            "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Verify universal package and ABI neutrality
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=Tager-v2.3.1-universal-stable-signed.apk
          PACKAGE="$($SDK_ROOT/build-tools/35.0.0/aapt dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$PACKAGE" = "com.tager.marketplace.universal" || { echo "Unexpected package: $PACKAGE" >&2; exit 1; }
          if unzip -l "$APK" | grep -qE ' lib/(armeabi|armeabi-v7a|arm64-v8a|x86|x86_64)/'; then
            echo 'Native libraries detected; ABI compatibility must be audited.' >&2
            exit 1
          fi
          echo "Universal package: $PACKAGE"
          echo 'No native libraries: architecture-neutral for ARM/x86/x86_64.'

      - name: Install and launch on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r Tager-v2.3.1-universal-stable-signed.apk
            adb shell pm path com.tager.marketplace.universal
            adb shell monkey -p com.tager.marketplace.universal -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell dumpsys package com.tager.marketplace.universal | grep -E 'versionName=2.3.1-universal|versionCode=23'
            adb shell pidof com.tager.marketplace.universal || adb shell dumpsys activity activities | grep com.tager.marketplace.universal

      - name: Upload universal stable-signed APK
        if: matrix.api == 28
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-universal-stable-signed-APK
          path: |
            Tager-v2.3.1-universal-stable-signed.apk
            Tager-v2.3.1-universal-stable-signed.apk.sha256
          retention-days: 14

      - name: Upload failed-install diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tager-universal-stable-api-${{ matrix.api }}-diagnostics
          path: |
            Tager-v2.3.1-universal-stable-signed.apk
          if-no-files-found: ignore
          retention-days: 7
