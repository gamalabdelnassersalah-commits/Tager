name: Build Tager Android 1.8 Production

on:
  push:
    branches: [ android-v1.8-production ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v18-production.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint production release
        working-directory: android-app
        run: gradle --no-daemon :app:lintRelease

      - name: Build release APK and AAB
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify release is not debuggable
        run: |
          if grep -R "android:debuggable=\"true\"" android-app/app/build/intermediates/merged_manifests/release 2>/dev/null; then
            echo "Release manifest is debuggable" >&2
            exit 1
          fi

      - name: Prepare production outputs
        run: |
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk Tager-v1.8.0-production-unsigned.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v1.8.0-production-unsigned.aab
          sha256sum Tager-v1.8.0-production-unsigned.apk > Tager-v1.8.0-production-unsigned.apk.sha256
          sha256sum Tager-v1.8.0-production-unsigned.aab > Tager-v1.8.0-production-unsigned.aab.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v1.8.0-production-unsigned-APK
          path: |
            Tager-v1.8.0-production-unsigned.apk
            Tager-v1.8.0-production-unsigned.apk.sha256
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v1.8.0-production-unsigned-AAB
          path: |
            Tager-v1.8.0-production-unsigned.aab
            Tager-v1.8.0-production-unsigned.aab.sha256
          retention-days: 30
