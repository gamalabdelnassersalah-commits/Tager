name: Test Tager Android 2.3.1 on Emulator

on:
  push:
    branches: [ android-v2.3.1-signing-readiness ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v231-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug and instrumentation APKs
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run Android runtime tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            cd android-app
            gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-instrumentation-results
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
