name: Test Tager Android 2.3.1 on Emulator

on:
  push:
    branches: [ android-v2.3.1-signing-readiness ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-v231-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify single external link dispatcher source architecture
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {'android': 'http://schemas.android.com/apk/res/android'}
          android = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse('android-app/app/src/main/AndroidManifest.xml').getroot()
          app = root.find('application')
          activities = {
              a.get(android + 'name'): a
              for a in app.findall('activity')
          }

          def require(name):
              if name not in activities:
                  raise SystemExit(f'Missing activity {name}')
              return activities[name]

          dispatcher = require('.TagerDeepLinkActivity')
          runtime = require('.TagerActivity')
          settings = require('.TagerSettingsActivity')
          downloads = require('.TagerDownloadsActivity')

          if dispatcher.get(android + 'exported') != 'true':
              raise SystemExit('DeepLink dispatcher must be exported')
          if runtime.get(android + 'exported') != 'false':
              raise SystemExit('TagerActivity must remain internal/non-exported')
          if settings.get(android + 'exported') != 'false':
              raise SystemExit('Settings activity must remain internal/non-exported')
          if downloads.get(android + 'exported') != 'false':
              raise SystemExit('Downloads activity must remain internal/non-exported')
          if runtime.findall('intent-filter'):
              raise SystemExit('TagerActivity must not own external intent filters')
          if settings.findall('intent-filter') or downloads.findall('intent-filter'):
              raise SystemExit('Native settings/downloads must route through dispatcher')

          filters = dispatcher.findall('intent-filter')
          schemes = []
          for f in filters:
              for data in f.findall('data'):
                  scheme = data.get(android + 'scheme')
                  if scheme:
                      schemes.append(scheme)
          if 'https' not in schemes or '${customScheme}' not in schemes:
              raise SystemExit(f'Dispatcher schemes incomplete: {schemes}')

          main_links = Path('android-app/app/src/main/res/values/shortcut_runtime_links.xml').read_text()
          debug_links = Path('android-app/app/src/debug/res/values/shortcut_runtime_links.xml').read_text()
          if 'tager://products' not in main_links or 'tager://settings' not in main_links:
              raise SystemExit('Production shortcut links are incomplete')
          if 'tager-test://products' not in debug_links or 'tager-test://settings' not in debug_links:
              raise SystemExit('Test shortcut links are not isolated')
          if 'tager-new.vercel.app' in debug_links or 'tager://' in debug_links.replace('tager-test://', ''):
              raise SystemExit('Test shortcut links leak production routing')

          print('Single dispatcher architecture and variant shortcut routing verified.')
          PY

      - name: Build release, debug and instrumentation outputs
        working-directory: android-app
        run: >-
          gradle --no-daemon
          :app:lintRelease
          :app:testReleaseUnitTest
          :app:assembleRelease
          :app:bundleRelease
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Verify package identity separation
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          RELEASE=android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG=android-app/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_PACKAGE="$($AAPT dump badging "$RELEASE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          DEBUG_PACKAGE="$($AAPT dump badging "$DEBUG" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$RELEASE_PACKAGE" = "com.tager.marketplace" || { echo "Unexpected release package: $RELEASE_PACKAGE" >&2; exit 1; }
          test "$DEBUG_PACKAGE" = "com.tager.marketplace.test" || { echo "Unexpected test package: $DEBUG_PACKAGE" >&2; exit 1; }
          test "$RELEASE_PACKAGE" != "$DEBUG_PACKAGE" || { echo 'Release and test packages must differ' >&2; exit 1; }
          echo "Release package: $RELEASE_PACKAGE"
          echo "Test package: $DEBUG_PACKAGE"

      - name: Verify deep link isolation
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          RELEASE=android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          DEBUG=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump xmltree "$RELEASE" AndroidManifest.xml > "$RUNNER_TEMP/release-manifest.txt"
          "$AAPT" dump xmltree "$DEBUG" AndroidManifest.xml > "$RUNNER_TEMP/debug-manifest.txt"
          grep -q 'tager-new.vercel.app' "$RUNNER_TEMP/release-manifest.txt" || { echo 'Release App Link host missing' >&2; exit 1; }
          grep -q 'tager-test.invalid' "$RUNNER_TEMP/debug-manifest.txt" || { echo 'Test App Link host missing' >&2; exit 1; }
          if grep -q 'tager-new.vercel.app' "$RUNNER_TEMP/debug-manifest.txt"; then
            echo 'Test APK must not claim the production App Link host' >&2
            exit 1
          fi
          grep -q 'tager-test' "$RUNNER_TEMP/debug-manifest.txt" || { echo 'Test custom scheme missing' >&2; exit 1; }
          echo 'Release and test deep-link registrations are isolated.'

      - name: Verify unsigned release APK alignment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signed debug APK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Tager-v2.3.1-test-signed.apk
          sha256sum Tager-v2.3.1-test-signed.apk > Tager-v2.3.1-test-signed.apk.sha256

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-test-signed-APK
          path: |
            Tager-v2.3.1-test-signed.apk
            Tager-v2.3.1-test-signed.apk.sha256
          retention-days: 14

      - name: Run Android runtime tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle --no-daemon -p android-app :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-instrumentation-results
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
