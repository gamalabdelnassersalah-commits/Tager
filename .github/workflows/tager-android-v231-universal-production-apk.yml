name: Build Tager 2.3.1 Universal Production APK

on:
  push:
    branches: [ android-v2.3.1-signing-readiness ]
    paths:
      - '.github/workflows/tager-android-v231-universal-production-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Require production signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TAGER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAGER_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing TAGER_ANDROID_KEYSTORE_B64' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing TAGER_ANDROID_STORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing TAGER_ANDROID_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing TAGER_ANDROID_KEY_PASSWORD' >&2; exit 1; }

      - name: Restore and verify production key
        env:
          KEYSTORE_B64: ${{ secrets.TAGER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tager-release.keystore"
          EXPECTED='D5:43:F1:DA:B8:BF:8F:C2:06:30:2D:96:2A:4C:E0:61:74:2E:39:5A:39:37:EE:7D:64:6A:8C:86:5D:F1:0E:C2'
          ACTUAL="$(keytool -list -v -keystore "$RUNNER_TEMP/tager-release.keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing certificate mismatch: $ACTUAL" >&2; exit 1; }

      - name: Align and sign universal APK
        env:
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAGER_ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          UNSIGNED=android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$RUNNER_TEMP/Tager-v2.3.1-universal-aligned.apk"
          OUT=Tager-v2.3.1-universal-production.apk
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -P 16 -v 4 "$UNSIGNED" "$ALIGNED"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tager-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$ALIGNED"

      - name: Verify universal install package
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APK=Tager-v2.3.1-universal-production.apk
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          EXPECTED_CERT='d543f1dab8bf8fc206302d96a24ce061742e395a3937ee7d646a8c865df10ec2'
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verify.txt"
          grep -q 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/verify.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/verify.txt"
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/verify.txt"
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT" "$RUNNER_TEMP/verify.txt"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$AAPT" dump badging "$APK" | grep "package: name='com.tager.marketplace' versionCode='23' versionName='2.3.1'"
          if unzip -l "$APK" | grep -qE ' lib/(armeabi|armeabi-v7a|arm64-v8a|x86|x86_64)/'; then
            echo 'Unexpected native ABI-specific libraries found.' >&2
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tager-release.keystore" "$RUNNER_TEMP/Tager-v2.3.1-universal-aligned.apk"

      - name: Upload universal production APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-universal-production-APK
          path: |
            Tager-v2.3.1-universal-production.apk
            Tager-v2.3.1-universal-production.apk.sha256
          retention-days: 14
