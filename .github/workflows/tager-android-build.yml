name: Build Tager Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android app
        uses: actions/checkout@v4

      - name: Install and verify original Tager artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://tager-new.vercel.app/tager-logo-full.png" \
            -o android-app/app/src/main/res/drawable-nodpi/tager_brand_full.png
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://tager-new.vercel.app/icon-512.png" \
            -o android-app/app/src/main/res/drawable-nodpi/tager_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          for name in ('tager_brand_full.png', 'tager_launcher.png'):
              p = Path('android-app/app/src/main/res/drawable-nodpi') / name
              data = p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name} is not a valid PNG'
              assert len(data) > 10000, f'{name} is unexpectedly small'
              print(name, len(data), 'bytes: PNG verified')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK and AAB
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Prepare outputs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Tager-v1.2.0-debug.apk
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk Tager-v1.2.0-unsigned-release.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v1.2.0-unsigned.aab

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-APK-v1.2.0-debug
          path: Tager-v1.2.0-debug.apk
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-APK-v1.2.0-unsigned-release
          path: Tager-v1.2.0-unsigned-release.apk
          retention-days: 30

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tager-AAB-v1.2.0-unsigned
          path: Tager-v1.2.0-unsigned.aab
          retention-days: 30
