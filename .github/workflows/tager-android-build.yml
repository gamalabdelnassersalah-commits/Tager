name: Build Tager Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Tager.apk

      - name: Upload Tager APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-APK
          path: Tager.apk
          retention-days: 30
