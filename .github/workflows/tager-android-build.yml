name: Validate Tager Android 1.4.0

on:
  workflow_dispatch:
  push:
    branches: [ android-v1.4-performance ]
    paths:
      - 'android-app/**'
      - '.github/workflows/tager-android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and release bundle
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Prepare validation outputs
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Tager-v1.4.0-test.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v1.4.0-unsigned.aab

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v1.4.0-test-APK
          path: Tager-v1.4.0-test.apk
          retention-days: 30

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v1.4.0-unsigned-AAB
          path: Tager-v1.4.0-unsigned.aab
          retention-days: 30
