name: Sign Tager Android 2.3.1 Production APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify release identity
        run: |
          BUILD=android-app/app/build.gradle
          grep -q "applicationId 'com.tager.marketplace'" "$BUILD"
          grep -q "versionCode 23" "$BUILD"
          grep -q "versionName '2.3.1'" "$BUILD"

      - name: Lint, tests and build unsigned release outputs
        working-directory: android-app
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TAGER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAGER_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing TAGER_ANDROID_KEYSTORE_B64' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing TAGER_ANDROID_STORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing TAGER_ANDROID_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing TAGER_ANDROID_KEY_PASSWORD' >&2; exit 1; }

      - name: Restore production keystore
        env:
          KEYSTORE_B64: ${{ secrets.TAGER_ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tager-release.keystore"
          test -s "$RUNNER_TEMP/tager-release.keystore"

      - name: Verify keystore certificate fingerprint before signing
        env:
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
        run: |
          EXPECTED='D5:43:F1:DA:B8:BF:8F:C2:06:30:2D:96:2A:4C:E0:61:74:2E:39:5A:39:37:EE:7D:64:6A:8C:86:5D:F1:0E:C2'
          ACTUAL="$(keytool -list -v -keystore "$RUNNER_TEMP/tager-release.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL" || { echo 'Unable to read signing certificate SHA-256' >&2; exit 1; }
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'Production signing certificate mismatch. Refusing to sign.' >&2
            exit 1
          fi
          echo 'Production signing certificate fingerprint verified.'

      - name: Align unsigned APK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -f -P 16 -v 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/Tager-v2.3.1-production-aligned.apk"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 \
            "$RUNNER_TEMP/Tager-v2.3.1-production-aligned.apk"

      - name: Sign production APK
        env:
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAGER_ANDROID_KEY_PASSWORD }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          KS_PASS="$STORE_PASSWORD" KEY_PASS="$KEY_PASSWORD" \
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tager-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Tager-v2.3.1-production-signed.apk \
            "$RUNNER_TEMP/Tager-v2.3.1-production-aligned.apk"

      - name: Verify signed APK and certificate continuity
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          EXPECTED='D5:43:F1:DA:B8:BF:8F:C2:06:30:2D:96:2A:4C:E0:61:74:2E:39:5A:39:37:EE:7D:64:6A:8C:86:5D:F1:0E:C2'
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs Tager-v2.3.1-production-signed.apk > "$RUNNER_TEMP/apksigner-verify.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-verify.txt" | head -n1 | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'Signed APK certificate continuity check failed.' >&2
            exit 1
          fi
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 Tager-v2.3.1-production-signed.apk
          sha256sum Tager-v2.3.1-production-signed.apk > Tager-v2.3.1-production-signed.apk.sha256

      - name: Sign production AAB
        env:
          STORE_PASSWORD: ${{ secrets.TAGER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAGER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAGER_ANDROID_KEY_PASSWORD }}
        run: |
          cp android-app/app/build/outputs/bundle/release/app-release.aab Tager-v2.3.1-production-signed.aab
          jarsigner \
            -keystore "$RUNNER_TEMP/tager-release.keystore" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            Tager-v2.3.1-production-signed.aab "$KEY_ALIAS"

      - name: Verify signed AAB
        run: |
          jarsigner -verify -strict -verbose -certs Tager-v2.3.1-production-signed.aab
          sha256sum Tager-v2.3.1-production-signed.aab > Tager-v2.3.1-production-signed.aab.sha256

      - name: Remove keystore material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tager-release.keystore" "$RUNNER_TEMP/Tager-v2.3.1-production-aligned.apk"

      - name: Upload production-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-production-signed-APK
          path: |
            Tager-v2.3.1-production-signed.apk
            Tager-v2.3.1-production-signed.apk.sha256
          retention-days: 14

      - name: Upload production-signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Tager-v2.3.1-production-signed-AAB
          path: |
            Tager-v2.3.1-production-signed.aab
            Tager-v2.3.1-production-signed.aab.sha256
          retention-days: 14
