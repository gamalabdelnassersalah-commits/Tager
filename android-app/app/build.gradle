plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tager.marketplace'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tager.marketplace'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '1.3.2'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
