import java.security.MessageDigest
import java.util.Base64
import java.util.zip.ZipFile

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tager.marketplace'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tager.marketplace'
        minSdk 23
        targetSdk 36
        versionCode 18
        versionName '2.0.2'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        disable 'ObsoleteSdkInt'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.browser:browser:1.10.0'
}

static String sha256(File file) {
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

def assertWebP = { File file ->
    byte[] bytes = file.bytes
    if (bytes.length < 12 || new String(bytes, 0, 4, 'US-ASCII') != 'RIFF' || new String(bytes, 8, 4, 'US-ASCII') != 'WEBP') {
        throw new GradleException("Invalid WebP branding file: ${file.name}")
    }
}

def decodeParts = { List<File> parts, File output, String expectedSha ->
    String encoded = parts.collect { it.getText('UTF-8').replaceAll('\\s+', '') }.join('')
    byte[] bytes = Base64.decoder.decode(encoded)
    output.parentFile.mkdirs()
    output.bytes = bytes
    String actual = sha256(output)
    if (actual != expectedSha) {
        throw new GradleException("Branding SHA mismatch for ${output.name}: ${actual}")
    }
    assertWebP(output)
}

def generateVerifiedBranding = tasks.register('generateVerifiedBranding') {
    def brandingDir = file("$rootDir/branding")
    def outputDir = file("$buildDir/generated/tagerBranding/verified")
    inputs.files(
        file("$brandingDir/icon_q75.part1.b64"),
        file("$brandingDir/icon_q75.part2.b64"),
        file("$brandingDir/icon_q75.part3.b64"),
        file("$brandingDir/splash_q50.part1.b64"),
        file("$brandingDir/splash_q50.part2.b64"),
        file("$brandingDir/splash_q50.part3.b64")
    )
    outputs.dir(outputDir)
    doLast {
        decodeParts([
            file("$brandingDir/icon_q75.part1.b64"),
            file("$brandingDir/icon_q75.part2.b64"),
            file("$brandingDir/icon_q75.part3.b64")
        ], new File(outputDir, 'tager_launcher.webp'), '86bd15d83d8f4f4642c94d62a4876b0a265b9fbc60462482f1cdda2768e4e4d9')

        decodeParts([
            file("$brandingDir/splash_q50.part1.b64"),
            file("$brandingDir/splash_q50.part2.b64"),
            file("$brandingDir/splash_q50.part3.b64")
        ], new File(outputDir, 'tager_splash.webp'), '8dc49f9cc334dcc8b25c8a4f263fc9f33fce742a314940350b1f6bd56860bee5')
    }
}

def brandingV2 = [
    'tager_nav_home.webp'      : 'c4f3a25d38a32b0953b688d549eaa302bb64946a2dd913d0fa787f5f9fa2e725',
    'tager_nav_products.webp'  : '4ade9f81ca7fcbeb74c67e35e60e78d3b66f65af7a3b3f65593ade60d762d49e',
    'tager_nav_suppliers.webp' : 'fb5650080f3b1d0a2a59f3792e64b6efc87c1ccad7c67c332095dcedcacfb8ba',
    'tager_nav_track.webp'     : 'd8bd4327b0828a29ff2a6120094b461020688084a15550f60e50b8a5d05a0c26',
    'tager_nav_cart.webp'      : '9ecd408174ecd8c87d93f18d48359681dde354c2dad72ede85b7f3b63dd4d5b3',
    'tager_splash_new.webp'    : '9199bfc33bc2bf1047c518eeddc528b2f06359a8725b7ebc8e17b5a59524f859',
    'tager_launcher_new.webp'  : 'd6021a8baf0fbd9894d2b7c78584ded33d45f08c0ea96faecfb3bf3012aef94e'
]

def installVerifiedBrandingV2 = tasks.register('installVerifiedBrandingV2') {
    def archive = file("$rootDir/branding/assets_v2.zip")
    def outputDir = file("$projectDir/src/main/res/drawable-nodpi")
    inputs.file(archive)
    outputs.files(
        new File(outputDir, 'tager_nav_home.webp'),
        new File(outputDir, 'tager_nav_products.webp'),
        new File(outputDir, 'tager_nav_suppliers.webp'),
        new File(outputDir, 'tager_nav_track.webp'),
        new File(outputDir, 'tager_nav_cart.webp'),
        new File(outputDir, 'tager_splash.webp'),
        new File(outputDir, 'tager_launcher.webp')
    )
    doLast {
        outputDir.mkdirs()
        ZipFile zip = new ZipFile(archive)
        try {
            brandingV2.each { name, expectedSha ->
                def entry = zip.getEntry(name)
                if (entry == null) throw new GradleException("Missing branding asset: ${name}")
                String outputName = name == 'tager_splash_new.webp'
                        ? 'tager_splash.webp'
                        : (name == 'tager_launcher_new.webp' ? 'tager_launcher.webp' : name)
                File output = new File(outputDir, outputName)
                output.withOutputStream { out -> zip.getInputStream(entry).withCloseable { input -> out << input } }
                String actual = sha256(output)
                if (actual != expectedSha) {
                    throw new GradleException("Branding SHA mismatch for ${name}: ${actual}")
                }
                assertWebP(output)
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn generateVerifiedBranding
    dependsOn installVerifiedBrandingV2
}
