plugins {
    id 'com.android.application'
}

def generatedBrandingResDir = layout.buildDirectory.dir('generated/tagerBranding/res')

android {
    namespace 'com.tager.marketplace'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tager.marketplace'
        minSdk 23
        targetSdk 36
        versionCode 12
        versionName '1.6.0'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.res.srcDir generatedBrandingResDir
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def verifyAndWriteWebp = { File source, File output, String expectedSha256, int expectedSize, String label ->
    if (!source.exists()) throw new GradleException("${label} source is missing")
    String encoded = source.getText('UTF-8').replaceAll('\\s+', '')
    byte[] decoded
    try {
        decoded = java.util.Base64.getDecoder().decode(encoded)
    } catch (Exception e) {
        throw new GradleException("${label} Base64 is invalid", e)
    }
    if (decoded.length != expectedSize) {
        throw new GradleException("${label} size mismatch: ${decoded.length} != ${expectedSize}")
    }
    if (decoded.length < 12 || new String(decoded, 0, 4, 'US-ASCII') != 'RIFF' || new String(decoded, 8, 4, 'US-ASCII') != 'WEBP') {
        throw new GradleException("${label} is not a valid WebP container")
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(decoded)
    String actualSha = digest.collect { String.format('%02x', it & 0xff) }.join()
    if (!actualSha.equalsIgnoreCase(expectedSha256)) {
        throw new GradleException("${label} SHA-256 mismatch: ${actualSha}")
    }
    output.parentFile.mkdirs()
    output.bytes = decoded
    println("Verified ${label}: ${output.length()} bytes, sha256=${actualSha}")
}

tasks.register('generateTagerBranding') {
    def launcherSource = file('src/main/assets/branding/tager_launcher_valid.b64')
    def splashSource = file('src/main/assets/branding/tager_splash_valid.b64')
    def launcherOutputProvider = generatedBrandingResDir.map { it.file('drawable-nodpi/tager_launcher.webp') }
    def splashOutputProvider = generatedBrandingResDir.map { it.file('drawable-nodpi/tager_splash.webp') }
    inputs.files(launcherSource, splashSource)
    outputs.files(launcherOutputProvider, splashOutputProvider)

    doLast {
        verifyAndWriteWebp(
            launcherSource,
            launcherOutputProvider.get().asFile,
            '09e4ebc534b98cc58286a776325b7ed98066ebe4f3afd048ecc0ca35f60db034',
            10514,
            'Tager launcher'
        )
        verifyAndWriteWebp(
            splashSource,
            splashOutputProvider.get().asFile,
            'f6621bebc53674efe4efbb57a8c040ffe1a0ac8b9c7a12ee8c9c90ba9c8025a5',
            11118,
            'Tager splash'
        )
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateTagerBranding')
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
